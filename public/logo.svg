<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="44" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid lines -->
  <line x1="0" y1="100" x2="200" y2="100" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="100" y1="0" x2="100" y2="200" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="72" stroke="url(#ringGrad)" stroke-width="2.5" fill="none" stroke-dasharray="8 4" opacity="0.4"/>
  
  <!-- Middle ring -->
  <circle cx="100" cy="100" r="58" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" fill="none"/>

  <!-- Progress arc (about 75%) -->
  <circle cx="100" cy="100" r="72"
    stroke="white" stroke-width="5"
    fill="none" stroke-linecap="round"
    stroke-dasharray="339" stroke-dashoffset="85"
    transform="rotate(-90 100 100)"
    filter="url(#glow)"
    opacity="0.95"/>

  <!-- Inner glow circle -->
  <circle cx="100" cy="100" r="44" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Flame icon -->
  <g transform="translate(78, 72)">
    <path d="M22 38C22 38 8 30 8 20C8 13 13 8 20 8C20 8 18 14 22 18C22 18 24 10 30 6C30 6 38 12 38 22C38 32 28 38 22 38Z"
      fill="white" opacity="0.95"/>
    <path d="M22 34C22 34 14 29 14 23C14 19 17 16 20 16C20 16 19 20 21 22C21 22 23 17 27 14C27 14 32 18 32 24C32 30 26 34 22 34Z"
      fill="rgba(0,0,0,0.25)"/>
  </g>

  <!-- AI spark dots -->
  <g filter="url(#glow)">
    <circle cx="100" cy="28" r="4" fill="white" opacity="0.9"/>
    <circle cx="155" cy="55" r="3" fill="white" opacity="0.7"/>
    <circle cx="172" cy="100" r="4" fill="white" opacity="0.9"/>
    <circle cx="155" cy="145" r="3" fill="white" opacity="0.6"/>
    <circle cx="100" cy="172" r="3.5" fill="white" opacity="0.8"/>
    <circle cx="45" cy="145" r="2.5" fill="white" opacity="0.5"/>
    <circle cx="28" cy="100" r="4" fill="white" opacity="0.9"/>
    <circle cx="45" cy="55" r="3" fill="white" opacity="0.7"/>
  </g>

  <!-- Connecting lines to dots -->
  <g opacity="0.2" stroke="white" stroke-width="1">
    <line x1="100" y1="28" x2="155" y2="55"/>
    <line x1="155" y1="55" x2="172" y2="100"/>
    <line x1="172" y1="100" x2="155" y2="145"/>
    <line x1="28" y1="100" x2="45" y2="55"/>
  </g>
</svg>
